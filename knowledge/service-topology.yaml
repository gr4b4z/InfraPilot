body: |
  ## Products and environments in InfraPortal

  | Product | Environments | Delivered by |
  |---|---|---|
  | `mpt` | dev, test, staging, prod | Track A (SDP) for dev/test; staging via `build → staging`; components move to mpt-release over time |
  | `mpt-extensions` | dev, test, staging, prod | Tracks B and C |
  | `mpt-support-tools`, `ops` | varies | Tracks B and C |
  | `marketplace` | staging, prod | **Historical** — not written to since 2026-08-07 |

  ## How to tell which track a service is on

  1. Does it have a directory in `mpt-release/<env>/`? → Track B or C.
  2. Is it listed in `marketplace/manifest.json` / `modules.yaml`? → Track A.
  3. Does it have builds in the registry *and* a `build → *` policy for its product? → Track C.

  Every published build is registered, `mpt` services included. For `mpt` the registration opens a
  `build → staging` promotion for release builds (Track A's staging pipeline deploys it once
  approved); there is **no `build → dev` policy for `mpt`**, so master builds of Track A services
  still reach dev and test through the marketplace manifest.

  The retired `stable` ("Staging Candidate") environment still exists in history for `mpt`,
  `mpt-extensions` and `mpt-support-tools`, but is hidden from every current-state view.

  ## Track A services (the monorepo)

  `swo-platform`, `mpt-helpdesk`, `mpt-notifications`, `mpt-public-catalog`, `mpt-spotlight`,
  `mpt-export`, `mpt-scheduler`, `swo-web-commerce`, `swo-web-accounts`, `swo-web-shell`,
  `mpt-web-helpdesk`, `mpt-extensions`.

  `marketplace/modules.yaml` groups these as `libs-frontend`, `libs-backend` and `services` — the
  libraries are built and consumed by the services, not deployed on their own.

  ## Track B / C services (mpt-release)

  ADO-built: `mpt-extension-adobe`, `swo-extension-mscsp`, `mpt-extension-installation`,
  `mpt-extension-usage-reporting`, `mpt-nav-stats`, `mpt-web-currency`, `mpt-web-publiccatalog`,
  `mpt-extension-nav-billing`, `mpt-extension-procurement`, `mpt-extension-producthub`,
  `swo-web-notifications`, `mpt-export`.

  GitHub-Actions-built: `ops-dotnet-ci-sample`.

  ## Deployment shapes

  `New-DeploymentMatrix.ps1` splits each reconcile into three kinds of target:

  - **helm** — containerised services onto AKS
  - **web (storage)** — SPA bundles uploaded to blob storage; the container name comes from
    `containerNameMap` in `components.yaml`, unless the component's `instance.yaml` overrides it
  - **swa** — Azure Static Web Apps

  `instance.yaml` decouples *what* is deployed and *where it lands* from the directory name, which
  is what allows multiple instances of the same chart (`litellm-shared-services/`, `litellm-team-x/`)
  and mirrored third-party charts under `helm/external/<name>`.

  ## Disabling a component

  `components.yaml` at the repository root sets global defaults; each stage or environment directory
  can overlay its own. `disabledComponents` is skipped by metadata import, promotion *and* reconcile
  for that target. The merge is additive for `disabledComponents` and `migrations.data`, and
  override-based for `containerNameMap`.
