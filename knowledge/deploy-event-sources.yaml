id: deploy-event-sources
title: Deploy event sources — which ones mean something actually deployed
group: Topology
summary: >-
  The five `source` values on a deploy event, which represent real deployments, and why event counts
  overstate deployment counts.
aliases:
  - what does helm-deploy mean
  - release-track source
  - mpt-manifest
  - why are there so many deploy events
  - how many deployments were there
  - deployment count
tags:
  - deploy event
