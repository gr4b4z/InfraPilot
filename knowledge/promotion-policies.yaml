body: |
  ## The policies in force

  | Product | Service | Edge | Approval | Work items | Auto-created from |
  |---|---|---|---|---|---|
  | `mpt` | all | build → dev | none (auto) | no | `refs/heads/master` |
  | `mpt` | all | build → staging | QA Manager ×1, then Release Manager ×1 | tracked | `refs/heads/release/*` |
  | `mpt` | all | dev → test | none (auto) | no | — |
  | `mpt` | all | staging → prod | QA Manager ×1, then Release Manager ×1 | tracked, **all must be approved** | — |
  | `mpt-extensions` | all | build → dev | none (auto) | no | `refs/heads/main`, `refs/heads/master` |
  | `mpt-extensions` | `mpt-extension-delivery` | build → dev | none (auto), no approval delay | no | `refs/heads/main`, `refs/heads/master` |
  | `mpt-extensions` | all | build → staging | QA Manager ×1, then Release Manager ×1 | tracked | `refs/heads/release/*` |
  | `mpt-extensions` | all | dev → test | none (auto) | no | — |
  | `mpt-extensions` | `swo-extension-mscsp` | dev → test | Guardians ×1 | no | — |
  | `mpt-extensions` | `swo-extension-mscsp` | build → staging, staging → prod | Guardians ×1 | tracked (prod: all must be approved) | build: `refs/heads/release/*` |
  | `mpt-extensions` | all | staging → prod | QA Manager ×1, then Release Manager ×1 | tracked, **all must be approved** | — |
  | `mpt-support-tools` | all | build → dev | none (auto) | no | `refs/heads/main`, `refs/heads/master` |
  | `mpt-support-tools` | all | build → staging | QA Manager ×1 | tracked | `refs/heads/release/*` |
  | `mpt-support-tools` | all | dev → test | none (auto) | no | — |
  | `mpt-support-tools` | all | test → staging | QA Manager ×1, then Release Manager ×1 | tracked | — |
  | `mpt-support-tools` | all | staging → prod | QA Manager ×1, then Release Manager ×1 | tracked, **all must be approved** | — |

  There is **no `stable → staging` policy any more**: the "Staging Candidate" edge was retired on
  2026-10-14 and its approvers moved, unchanged, onto `build → staging`. `mpt`'s `build → dev`
  deploys only services migrated to mpt-release. Its other services still deploy dev and test
  straight from the marketplace manifest (Track A). For those, mpt-release skips the candidate as a
  disabled component, and SDP's dev deploy of the version closes it.

  ## Why they are shaped like this

  **Gates tighten as blast radius grows.** `dev` and `test` are disposable — a bad version there
  costs a redeploy, so a human gate would only add latency to the feedback loop it exists to
  protect. `staging` is the first environment someone outside the team looks at, so it takes a QA
  Manager. `prod` takes the same approver *plus* a requirement that every work item in the bundle is
  signed off, because at that edge the question changes from "does it run?" to "is everything in
  this release meant to ship?".

  **A policy with zero approval steps is auto-approved, not ungated.** The candidate is still
  created, recorded, and closed by the deploy event. That is deliberate: it keeps `dev → test` in
  the same ledger as `staging → prod`, so the history of a version is one unbroken chain regardless
  of how much ceremony each hop carried. Reading an auto edge as "no policy" is the most common
  misreading — the record exists, only the pause does not.

  **Service-specific overrides exist where ownership differs, not where risk does.**
  `swo-extension-mscsp` carries a Guardians gate even at `dev → test`, which no other service does.
  That is not because the service is riskier; it is because a different team owns the decision, and
  the policy is where that ownership is expressed.

  **`build → *` policies set `sourceRequiresDeploy = false`.** `build` is a synthetic source
  environment that never receives deploy events, so the usual "the source environment must actually
  be running this version" check cannot apply. Without that flag every build-registry promotion
  would be rejected for a missing source deploy.

  **`autoCreateFromBranches` is what makes a build edge automatic.** A registered build whose branch
  matches opens the promotion on its own (main/master → dev, release/* → staging); any other branch
  — a feature build — registers and waits until someone promotes it. The approval steps are a
  separate question: `build → dev` auto-approves, `build → staging` waits for QA and release.

  **`test → staging` exists only for `mpt-support-tools`.** Most of its services never build from a
  release branch, so `build → staging` alone would leave them no way into staging.

  ## Work item tracking

  Where a policy tracks work items, the promotion carries the bundle of Jira/ADO items in the
  version range. At `staging → prod` **all of them must be approved** before the gate clears. An
  item flagged with an issue is counted separately rather than hidden behind a green tick — a
  cleared bundle can legitimately read "4 of 5 approved, 1 with an issue", because an issue is a
  flag, not a block.

  Sign-off is scoped to `(work item, product, service, target environment)`. Approving an item for
  `staging` does **not** approve it for `prod`; the same item is asked about again at the next edge,
  on purpose.

  ## What policies do not do

  Gating lives entirely here — there are no per-component gate contracts in mpt-release. An admin
  can still step outside the gate in two ways, both audited and both requiring a reason:
  **bypass** (approve without the gate) and **admin reject** (reject without being an approver,
  e.g. to clear stale promotions; also `POST /api/promotions/admin/candidates/{id}/reject`).
