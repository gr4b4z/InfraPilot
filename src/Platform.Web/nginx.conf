server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Same caching rules as infra/nginx-single.conf — see the reasoning there.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /config.json {
    add_header Cache-Control "no-store";
  }
  location = /version.json {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/assets/.+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @missing_bundle;
  }

  location @missing_bundle {
    add_header Cache-Control "no-store";
    return 200 'var k="ip.missingBundleReload",t=0;try{t=+sessionStorage.getItem(k)||0}catch(e){}if(Date.now()-t>30000){try{sessionStorage.setItem(k,String(Date.now()))}catch(e){}location.reload()}else{var x=new Error("The page asked for "+import.meta.url+", which the server does not have. Reload the page; if this keeps happening, clear the browser cache.");x.name="MissingBundleError";throw x}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
