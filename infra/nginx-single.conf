server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Realtime hub — WebSocket upgrade plus unbuffered long-polling fallback.
  location /api/hubs/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /agent/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://127.0.0.1:8081/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # ── Caching ────────────────────────────────────────────────────────────────────────────────
  # Without explicit headers browsers guess a freshness lifetime from Last-Modified and keep
  # serving an old index.html for hours after a deploy. That copy names content-hashed bundles the
  # new image doesn't have, so the page either runs the previous release against the new API or —
  # once the old bundle has left the cache too — loads nothing at all: the white screen that only
  # clearing the cache fixed.

  # The SPA shell, reached directly or through the fallback below. `no-cache` means "revalidate
  # every time", which costs a 304 on the ETag when nothing changed.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Written at container start / per build; the app fetches both and must never see an old one.
  location = /config.json {
    add_header Cache-Control "no-store";
  }
  location = /version.json {
    add_header Cache-Control "no-store";
  }

  # Content-hashed build output: a name changes whenever its content does, so it can be kept
  # forever. A missing asset is a 404, never the SPA shell — HTML handed to a <script> fails with a
  # MIME-type error and a blank page. (No `always`: a cached 404 would outlive the next deploy.)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~ ^/assets/.+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @missing_bundle;
  }

  # A bundle this deploy doesn't have means the page asking for it is out of date — an old copy from
  # the browser cache, or one served by the other replica mid-rollout. Answer with a script that
  # reloads once, which fetches the current page and with it the current bundle names. The 30 s
  # guard stops a loop; a second miss throws a MissingBundleError, which the page's boot watchdog
  # (index.html) reports as an out-of-date page.
  location @missing_bundle {
    add_header Cache-Control "no-store";
    return 200 'var k="ip.missingBundleReload",t=0;try{t=+sessionStorage.getItem(k)||0}catch(e){}if(Date.now()-t>30000){try{sessionStorage.setItem(k,String(Date.now()))}catch(e){}location.reload()}else{var x=new Error("The page asked for "+import.meta.url+", which the server does not have. Reload the page; if this keeps happening, clear the browser cache.");x.name="MissingBundleError";throw x}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
