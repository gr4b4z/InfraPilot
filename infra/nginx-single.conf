# Included inside nginx.conf's http {} block (copied to /etc/nginx/conf.d/default.conf), so the
# upstream, maps and log format below sit at http level.

# The API, with idle connections kept open so each proxied request stops paying for a fresh loopback
# TCP connection. Keepalive needs HTTP/1.1 and an empty Connection header in every location that
# proxies here.
upstream platform_api {
  server 127.0.0.1:8081;
  keepalive 16;
}

# Connection header for the hub: "upgrade" on a WebSocket handshake, otherwise empty so the hub's
# plain requests (negotiate, long polling) reuse kept-alive connections like the rest of /api.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# nginx's access log carries failures only: the API already logs every request it answers (see
# AddHttpLogging in Program.cs). A 5xx here is usually nginx's own 502/504 for an API that is down or
# too slow, and a 499 is a client that gave up waiting — neither reaches the API's log.
map $status $loggable {
  ~^5     1;
  499     1;
  default 0;
}

# $uri rather than $request or $request_uri, which include the query string: the SignalR client puts
# its access token there. The upstream fields tell a 502 nginx made itself (the connect failed) from a
# 5xx the API returned.
log_format failures 'nginx: $request_method $uri $status request_time=$request_time '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'upstream_time=$upstream_response_time';

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Ubuntu's nginx.conf logs to files under /var/log/nginx, which nothing reads; send both logs to
  # the container's output, which Container Apps collects. Set at server level because nginx.conf
  # already has an http-level access_log — another one beside it here would log to both. The error
  # log is where "connect() failed … while connecting to upstream" explains a 502.
  error_log /dev/stderr warn;
  access_log /dev/stdout failures if=$loggable;

  # Compress text responses — mostly the API's JSON, which runs to megabytes on the deployments and
  # work-item pages. Level 4 shrinks a deployments/state payload about 9x (level 9: about 11x) for
  # under half level 9's CPU, and the container has half a vCPU. Set here rather than at http level
  # because Ubuntu's nginx.conf already has `gzip on;` there.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain application/xml text/xml;

  location /api/ {
    proxy_pass http://platform_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Bulk and mass approve sign every promotion in one request, one after another, each a full
    # approval (audit, re-evaluation, webhooks). Forty-odd rows on a release night under load can
    # outlast nginx's 60s default, and a 504 there leaves the API still approving while the user
    # retries. 120s gives that headroom and stays under the Container Apps ingress's 240s limit.
    proxy_read_timeout 120s;
  }

  # Realtime hub — WebSocket upgrade plus unbuffered long-polling fallback.
  location /api/hubs/ {
    proxy_pass http://platform_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    # SignalR's server-sent-events and long-polling responses are small messages that must go out as
    # soon as they are written — keep them out of gzip's buffer.
    gzip off;
    # Browsers can't set headers on a WebSocket handshake, so the SignalR client sends its access
    # token in the query string (?access_token=…) — keep it out of the access log, and out of the
    # error log too, whose lines quote the full request line. Upstream failures are logged at
    # "error", so a crit threshold drops them here.
    access_log off;
    error_log /dev/stderr crit;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /agent/ {
    proxy_pass http://platform_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://platform_api/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }

  # Vite's build output. Every file name carries a content hash, so a changed file is a new URL and
  # browsers can keep these forever. A missing file is a 404, not the SPA shell.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Written by start.sh at container start from the environment; must never be cached.
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # The SPA shell, served directly and as the fallback below. Always revalidated, so a deploy is
  # picked up on the next load instead of the browser running the previous release's bundles.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
